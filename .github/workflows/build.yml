name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          CODE=$(grep 'versionCode =' app/build.gradle.kts | head -1 | sed -E 's/.*= *([0-9]+).*/\1/')
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/9router-android-v${VERSION}-${CODE}-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk "artifacts/9router-android-v${VERSION}-${CODE}-release-unsigned.apk" 2>/dev/null || true
          # fallback without version for artifact upload
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/app-debug.apk 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/app-release-unsigned.apk 2>/dev/null || true
          ls -lh artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 9router-debug-apk
          path: artifacts/*debug*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 9router-release-apk
          path: artifacts/*release*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/9router-android-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
